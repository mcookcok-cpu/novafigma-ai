<!doctype html>
<html>
<head><meta charset="UTF-8"><title>NovaFigma AI</title>
<style>
body{font-family:Inter,Arial,sans-serif;margin:0;padding:18px;background:#f7f7f5;color:#202124}
h2{margin:0 0 6px}.sub{font-size:12px;color:#666;margin-bottom:16px}
label{font-size:12px;color:#444;display:block;margin:10px 0 4px}
input,select,textarea{width:100%;box-sizing:border-box;border:1px solid #ddd;border-radius:10px;padding:10px;font-family:inherit;font-size:13px}
textarea{height:90px;resize:none}
.row{display:flex;gap:6px}
.row > *{flex:1}
button{width:100%;padding:11px;margin-top:10px;border:0;border-radius:10px;background:#f06a3b;color:white;font-weight:600;cursor:pointer}
button.secondary{background:#333}
hr{border:0;border-top:1px solid #eee;margin:14px 0}
small{color:#888}
</style></head>
<body>
<h2>NovaFigma AI</h2>
<div class="sub">UI & prototype generator</div>

<label>Nama screen</label>
<input id="name" value="home" placeholder="contoh: home">

<label>Judul di canvas</label>
<input id="title" value="NovaCook Home">

<div class="row">
  <div><label>Width</label><input id="w" type="number" value="390"></div>
  <div><label>Height</label><input id="h" type="number" value="844"></div>
</div>

<button onclick="create()">Buat Screen</button>

<hr>

<label>Trigger koneksi</label>
<select id="trigger">
  <option value="click">click</option>
  <option value="hover">hover</option>
  <option value="drag">drag</option>
  <option value="press">press</option>
</select>

<label>From frame (name)</label>
<input id="from" value="home" placeholder="nama frame asal">

<label>To frame (name)</label>
<input id="to" value="recipe-detail" placeholder="nama frame tujuan">

<button class="secondary" onclick="addConn()">Tambah Koneksi</button>

<label style="margin-top:14px">Daftar koneksi saat ini</label>
<textarea id="conns" readonly style="height:70px"></textarea>

<button onclick="prototype()">Buat Prototype</button>

<script>
const send=(type,payload={})=>parent.postMessage({pluginMessage:{type,...payload}},"*");

function get(id){return document.getElementById(id).value;}

function create(){
  send("create-screen",{screen:{
    name:  get("name"),
    title: get("title"),
    width: parseInt(get("w"))||390,
    height:parseInt(get("h"))||844
  }});
}

let conns=[];
function addConn(){
  conns.push({from:get("from"),to:get("to"),trigger:get("trigger")});
  document.getElementById("conns").value = JSON.stringify(conns,null,2);
}
function prototype(){
  // Fallback jika user belum tekan "Tambah Koneksi"
  if(conns.length===0){
    addConn();
    addConn();
  }
  send("create-prototype",{flow:{connections:conns}});
}
</script>
</body>
</html>
