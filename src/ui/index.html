<!doctype html>
<html>
<head><meta charset="UTF-8"><title>NovaFigma AI</title>
<style>
body{font-family:Inter,Arial,sans-serif;margin:0;padding:18px;background:#f7f7f5;color:#202124}
h2{margin:0 0 6px}.sub{font-size:12px;color:#666;margin-bottom:16px}
textarea{width:100%;height:110px;box-sizing:border-box;border:1px solid #ddd;border-radius:12px;padding:12px;resize:none}
button{width:100%;padding:11px;margin-top:10px;border:0;border-radius:10px;background:#f06a3b;color:white;font-weight:600;cursor:pointer}
.secondary{background:#333}
</style></head>
<body>
<h2>NovaFigma AI</h2><div class="sub">UI & prototype generator</div>
<textarea id="prompt" placeholder="Contoh: Buat Home aplikasi resep untuk Android..."></textarea>
<button onclick="create()">Buat Screen</button>
<button class="secondary" onclick="prototype()">Siapkan Prototype</button>
<script>
const send=(type,payload={})=>parent.postMessage({pluginMessage:{type,...payload}},"*");
function create(){
  send("create-screen",{screen:{name:"NovaCook Home",title:"NovaCook",width:390,height:844}});
}
function prototype(){
  send("create-prototype",{flow:{connections:[
    {from:"home.recipe",to:"recipe-detail",trigger:"click"},
    {from:"home.search",to:"search",trigger:"click"},
    {from:"home.favorite",to:"favorites",trigger:"click"},
    {from:"home.profile",to:"profile",trigger:"click"}
  ]}});
}
</script></body></html>
